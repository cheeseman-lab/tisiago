[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tisiago"
version = "0.1.0"
description = "TIS prediction from sequence and RNA-seq: fine-tuned AlphaGenome tracks, start calls, frozen baseline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "h5py>=3.10.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

# Extraction stage runs in the alphagenome GPU env. It additionally needs
# gruyerenome (installed from its own checkout because backend extras are hardware-specific)
# plus pyfaidx for genomic window fetch. See README.md for the uv commands.
[project.optional-dependencies]
extract = [
    "pyfaidx>=0.8",
]
tracks = [
    "pysam>=0.22",
    "pyBigWig>=0.3.22",
]
plots = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tisiago"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
