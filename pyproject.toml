[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tisiago"
version = "0.1.0"
description = "TIS-prediction orchestrator: swissisoform table + gruyerenome embeddings -> trained heads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "h5py>=3.10.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

# Extraction stage runs in the GPU envs (alphagenome / evo2). It additionally needs
# gruyerenome (installed editable from the sibling repo, not on PyPI) + pyfaidx for
# genomic window fetch. Install with: uv pip install -e ".[extract]" then
# uv pip install -e /lab/barcheese01/mdiberna/gruyerenome
[project.optional-dependencies]
extract = [
    "pyfaidx>=0.8",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tisiago"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]
"autoresearch/*.py" = ["D103"]  # runnable experiment scripts, not library code

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
