[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tisiago"
version = "0.1.0"
description = "TIS-prediction orchestrator: swissisoform table + gruyerenome embeddings -> trained heads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "h5py>=3.10.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
]

# Extraction stage runs in the GPU envs (alphagenome / evo2). It additionally needs
# gruyerenome (installed from its own checkout because backend extras are hardware-specific)
# plus pyfaidx for genomic window fetch. See README.md for the uv commands.
[project.optional-dependencies]
extract = [
    "pyfaidx>=0.8",
]
heads = [
    "xgboost>=2.0",
    "lightgbm>=4.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    # The full suite exercises every supported trained-head implementation.
    "xgboost>=2.0",
    "lightgbm>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tisiago"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]
"autoresearch/*.py" = ["D103"]  # runnable experiment scripts, not library code
# This generator intentionally embeds long HTML/CSS/JS literals; wrapping them as
# Python source makes the template harder to maintain without improving the output.
"scripts/build_report.py" = ["D103", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
