# t3_foc_lw5 with the Poisson term on per-transcript (crop) totals (as ref_rnacond_ps).
name: t3_foc_lw5_ps
inputs: [embedding, rna, rna_onesided]
model:
  trunk: {kind: mlp, hidden: 256, layers: 1}
  chx_contrast: true
  tis: {kind: factorised, block: 1024, two_grids: true}
  chx: {kind: softplus}
losses:
  - {kind: poisson, scope: sample, weight: 1.0}
  - {kind: multinomial, scope: global, weight: 5.0}
  - {kind: multinomial, scope: local, block: 1024, libraries: [tis], weight: 5.0}
