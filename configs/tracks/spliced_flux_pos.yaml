# Reference recipe, stage 2 (tracks.spliced.flux.pos): head + losses for train_spliced / fastloop.
# Was autoresearch/p6flux/configs/g7_replace_fixed_grad_k1.yaml (FINDINGS §16). cache and heldout
# are per fold: pass --cache and --heldout on the command line.
name: tracks.spliced.flux.pos
train:
  steps: 30000
inputs:
- embedding
- rna
- rna_onesided
model:
  trunk:
    kind: conv
    hidden: 256
    layers: 2
    width: 9
  chx_contrast: false
  chx_trunk:
    kind: conv
    hidden: 256
    layers: 2
    width: 25
  tis:
    kind: factorised
    block: 1024
    two_grids: true
  chx:
    kind: factorised
    block: 1024
    two_grids: true
  tis_context:
    kind: dilated
    hidden: 256
    channels: 128
    dilations:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    - 256
  tis_onehot:
    width: 41
    channels: 64
    layers: 1
  chx_flux:
    mode: replace
    stop_gradient_init: false
    frame_kernel: 1
    stop_codons: fixed
    learned_hazard: false
losses:
- kind: poisson
  scope: sample
  weight: 1.0
- kind: multinomial
  scope: local
  block: 1024
  libraries:
  - tis
  - chx
  weight: 300
- kind: multinomial
  scope: global
  weight: 5.0
- kind: multinomial
  scope: local
  block: 32
  libraries:
  - tis
  weight: 300
- kind: multinomial
  scope: local
  block: 3
  libraries:
  - tis
  weight: 300
cache: data/tracks/txcache/genomic_fc2d_k562
heldout:
- K562
seed: 0
