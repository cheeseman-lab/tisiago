# TIS per-candidate extraction — Evo-2 7B, 8 kb left-heavy windows.
# Env: evo2.  Intermediate layers swept in one forward pass; offsets {0,3,6,9}
# (applied by the tiler) capture the downstream Kozak/frame context Evo-2's
# causality hides at the codon position itself.
model: evo2
input_fasta: ""
output_dir: ./data/tis/parts
output_format: h5
batch_size: 1            # Evo-2 embeds one sequence per forward pass
device: cuda
dtype: bfloat16
evo2_layers:
  - blocks.24.mlp.l3
  - blocks.26.mlp.l3
  - blocks.28.mlp.l3
embedding_offsets: [0, 3, 6, 9]
