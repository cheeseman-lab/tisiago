# Opt-in speed ablation for the upgraded Evo2/Vortex environment.
# Measured faster for fixed-length W8k but much slower for variable-length TXP.
# Numerically distinct features require a separately trained, accuracy-gated head.
model: evo2
input_fasta: ""
output_dir: ./data/tis/parts
output_format: h5
batch_size: 1
device: cuda
dtype: bfloat16
evo2_layers:
  - blocks.28.mlp.l3
evo2_use_kernels: true
embedding_offsets: [0, 3, 6, 9]
